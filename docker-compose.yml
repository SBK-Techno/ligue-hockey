services:
  ligue:
    build: .
    image: ligue-hockey:latest
    container_name: ligue-hockey
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: /app/data/ligue.db
      MIGRATIONS_DIR: /app/drizzle
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ligue-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ligue-data:
