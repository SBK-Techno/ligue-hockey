name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/sbk-techno/ligue-hockey
    steps:
      - name: Récupérer la révision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier la version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $expected."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Construire l'image
        env:
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$SOURCE" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" .
      - name: Publier l'image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La version $GITHUB_REF_NAME existe déjà."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
