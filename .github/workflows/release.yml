name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Étiquette de version à publier
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/sbk-techno/ligue-hockey
    steps:
      - name: Récupérer la révision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Vérifier la version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match package.json $expected."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_NAME=$(node -p 'require("./config/branding.json").name')" >> "$GITHUB_ENV"
          echo "APP_DESCRIPTION=$(node -p 'require("./config/branding.json").description')" >> "$GITHUB_ENV"
      - name: Construire l'image
        env:
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE="$SOURCE" \
            --build-arg APP_NAME="$APP_NAME" \
            --build-arg APP_DESCRIPTION="$APP_DESCRIPTION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" .
      - name: Publier l'image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La version $tag existe déjà."
          else
            gh release create "$tag" --generate-notes --title "$tag"
          fi
