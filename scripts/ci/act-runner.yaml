# Configuration du coureur Gitea de ce dépôt.
# Le chemin du répertoire de travail est substitué par scripts/ci/runner.sh.

log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 30m
  shutdown_timeout: 30s
  fetch_interval: 2s
  labels:
    - "linux:docker://node:24-bookworm"

cache:
  enabled: false

container:
  network: ""
  privileged: false
  workdir_parent: @WORKDIR_PARENT@
  valid_volumes: []
  docker_host: ""
  force_pull: false
  force_rebuild: false

host:
  workdir_parent: ""
