# Configuration du coureur Gitea de ce dépôt.
# Le chemin du répertoire de travail est substitué par scripts/ci/runner.sh.
# Les étiquettes de coureur sont définies ici seulement; le script ne les duplique pas.

log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 30m
  shutdown_timeout: 30s
  fetch_interval: 2s
  labels:
    - "linux:docker://node:24-bookworm"

cache:
  enabled: false

container:
  network: ""
  privileged: false
  # "-" empêche le montage du socket Docker de l'hôte dans les conteneurs de tâche.
  docker_host: "-"
  workdir_parent: "__WORKDIR_PARENT__"
  valid_volumes: []
  force_pull: true
  force_rebuild: false

host:
  workdir_parent: ""
